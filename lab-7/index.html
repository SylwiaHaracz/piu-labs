<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 7</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 40px;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 32px;
        align-items: start;
      }

      product-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, 300px);
        gap: 24px;
      }

      shopping-cart {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body>
    <h1>Lab 7 - sklep</h1>

    <main>
      <product-list></product-list>
      <shopping-cart></shopping-cart>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
